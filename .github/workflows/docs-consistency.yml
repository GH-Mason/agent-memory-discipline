name: docs-consistency

# The example output quoted in examples/README.md must match what
# scripts/memory-audit.py actually prints. "Documentation as test": if the
# script's output drifts, CI fails instead of the docs silently lying.

on:
  push:
  pull_request:

jobs:
  check-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/check-example.py
